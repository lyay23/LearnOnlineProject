#微服务配置
spring:
  application:
    name: content-api
  cloud:
    nacos:
      server-addr: 192.168.163.129:8848
      discovery:
        namespace: learnonlinedev
        group: learnonlinedev
      config:
        namespace: learnonlinedev
        group: learnonlinedev
        file-extension: yaml
        refresh-enabled: true
        extension-configs:
          - data-id: content-service-dev.yaml
            group: learnonlinedev
            refresh: true
        shared-configs:
          - data-id: log-dev.yaml
            group: learnonlinedev

  profiles:
   active: dev



