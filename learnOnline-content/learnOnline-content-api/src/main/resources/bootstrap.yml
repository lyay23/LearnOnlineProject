#微服务配置
spring:
  application:
    name: content-api
  cloud:
    nacos:
      server-addr: 192.168.163.129:8848
      discovery:
        namespace: learnonlinedev
        group: xuecheng-plus-project
      config:
        namespace: learnonlinedev
        group: xuecheng-plus-project
        file-extension: yaml
        refresh-enabled: true
        extension-configs:
          - data-id: content-service-dev.yaml
            group: xuecheng-plus-project
            refresh: true
          - data-id: freemarker-config-dev.yaml
            group: xuecheng-plus-common
            refresh: true
        shared-configs:
          - data-id: log-dev.yaml
            group: xuecheng-plus-common

  profiles:
   active: dev



