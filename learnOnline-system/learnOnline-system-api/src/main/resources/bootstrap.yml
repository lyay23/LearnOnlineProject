server:
  servlet:
    context-path: /system
  port: 63110
#微服务配置
spring:
  application:
    name: system-api
  cloud:
    nacos:
      server-addr: 192.168.163.129:8848
      discovery:
        namespace: learnonlinedev
        group: xuecheng-plus-project
      config:
        namespace: learnonlinedev
        group: xuecheng-plus-project
        file-extension: yaml
        refresh-enabled: true
        extension-configs:
          - data-id: system-service-dev.yaml
            group: xuecheng-plus-project
            refresh: true
        shared-configs:
          - data-id: log-dev.yaml
            group: learnonlinedev
            refresh: true

  profiles:
    active: dev
